<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Холбоо барих</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <a href="index.php">Нүүр</a>
            <a href="about.html">Бидний тухай</a>
            <a href="contact.html" class="active">Холбоо барих</a>
        </nav>
    </header>

    <main class="content-section">
        <h1>Холбоо барих</h1>
        <form id="contactForm" onsubmit="event.preventDefault(); submitForm();">
            <div class="form-group">
                <label for="name">Нэр:</label>
                <input type="text" id="name" required placeholder="Нэрээ оруулна уу">
            </div>
            <div class="form-group">
                <label for="email">И-мэйл:</label>
                <input type="email" id="email" required placeholder="И-мэйл хаягаа оруулна уу">
            </div>
            <div class="form-group">
                <label for="message">Зурвас:</label>
                <textarea id="message" rows="4" required placeholder="Санал хүсэлтээ бичнэ үү"></textarea>
            </div>
            <button type="submit">Илгээх</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Миний Бие Даалтын Веб Сайт</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
